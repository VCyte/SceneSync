name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test all modules
        run: ./gradlew --no-daemon clean test build
      - name: Verify distributable jars
        run: |
          test -s paper-plugin/build/libs/SceneSync-Paper-0.1.0.jar
          test -s fabric-client/build/libs/scenesync-client-26.2-0.1.0.jar
          test -s scenesync-api/build/libs/scenesync-api-0.1.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: scenesync-development-build
          path: |
            paper-plugin/build/libs/SceneSync-Paper-0.1.0.jar
            fabric-client/build/libs/scenesync-client-26.2-0.1.0.jar
            scenesync-api/build/libs/scenesync-api-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
