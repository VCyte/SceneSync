name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build and test all modules
        run: ./gradlew --no-daemon clean test build
      - name: Read project version
        id: version
        run: echo "VERSION=$(./gradlew -q properties | awk '$1=="version:" {print $2}')" >> "$GITHUB_ENV"
      - name: Verify distributable jars
        run: |
          test -s paper-plugin/build/libs/SceneSync-Paper-${VERSION}.jar
          test -s fabric-client/build/libs/scenesync-client-26.2-${VERSION}.jar
          test -s scenesync-api/build/libs/scenesync-api-${VERSION}.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenesync-development-build
          path: |
            paper-plugin/build/libs/SceneSync-Paper-${VERSION}.jar
            fabric-client/build/libs/scenesync-client-26.2-${VERSION}.jar
            scenesync-api/build/libs/scenesync-api-${VERSION}.jar
          if-no-files-found: error
          retention-days: 14
