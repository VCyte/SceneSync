name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build and test
        run: ./gradlew --no-daemon clean test build
      - name: Read project version
        run: echo "VERSION=$(./gradlew -q properties | awk '$1=="version:" {print $2}')" >> "$GITHUB_ENV"
      - name: Publish SceneSync API to GitHub Packages
        run: ./gradlew --no-daemon :scenesync-api:publish
        env:
          SCENESYNC_MAVEN_URL: https://maven.pkg.github.com/${{ github.repository_owner }}/SceneSync
          SCENESYNC_MAVEN_USERNAME: ${{ github.actor }}
          SCENESYNC_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble release assets
        run: |
          mkdir -p dist
          cp paper-plugin/build/libs/SceneSync-Paper-${VERSION}.jar dist/
          cp fabric-client/build/libs/scenesync-client-26.2-${VERSION}.jar dist/
          cp scenesync-api/build/libs/scenesync-api-${VERSION}.jar dist/
          (cd dist && sha256sum *.jar > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "SceneSync $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
