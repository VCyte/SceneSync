plugins {
    id 'java-library'
    id 'maven-publish'
}
base { archivesName = 'scenesync-api' }
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.124-stable'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
tasks.named('test') { useJUnitPlatform() }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'scenesync-api'
            pom {
                name = 'SceneSync API'
                description = 'Paper API for server-authored synchronized Minecraft scenes.'
                url = 'https://github.com/VCyte/SceneSync'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/VCyte/SceneSync.git'
                    developerConnection = 'scm:git:ssh://git@github.com/VCyte/SceneSync.git'
                    url = 'https://github.com/VCyte/SceneSync'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'githubPackages'
            url = uri(providers.environmentVariable('SCENESYNC_MAVEN_URL').orElse(
                    layout.buildDirectory.dir('maven-repo').map { it.asFile.toURI().toString() }).get())
            def user = providers.environmentVariable('SCENESYNC_MAVEN_USERNAME').orNull
            def token = providers.environmentVariable('SCENESYNC_MAVEN_PASSWORD').orNull
            if (user != null && token != null) {
                credentials { username = user; password = token }
            }
        }
    }
}
