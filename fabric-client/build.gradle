plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}
base { archivesName = 'scenesync-client-26.2' }
loom {
    splitEnvironmentSourceSets()
    mods {
        'scenesync' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
sourceSets.test.compileClasspath += sourceSets.client.output
tasks.named('compileTestJava') { dependsOn tasks.named('compileClientJava') }
tasks.named('test') {
    dependsOn tasks.named('compileClientJava')
    useJUnitPlatform()
}
