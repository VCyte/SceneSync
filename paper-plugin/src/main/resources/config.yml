max-view-distance: 64.0
scenes:
  demo:
    duration-ticks: 80
    damage-policy: CANCEL_SCENE # or IGNORE_DAMAGE to cancel hits and keep the scene playing
    animation-damage-policies:
      wave: IGNORE_DAMAGE
      bow: CANCEL_SCENE
    camera:
      mode: LIMITED # FREE_LOOK preserves mouse aim; LOCKED follows the authored yaw/pitch track
      max-yaw-degrees: 80.0 # stops the view before the actor's rear
      max-pitch-degrees: 45.0
    frames:
      - tick: 0
        x: 0.0
        y: 0.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
        animation: idle
        camera-yaw: 0.0 # actor-relative target used by LOCKED/LIMITED modes
        camera-pitch: 0.0
        camera-roll: 0.0
        camera-shake: 0.0
        camera-fov: 0.0
      - tick: 20
        x: 0.0
        y: 0.0
        z: 1.5
        yaw: 0.0
        pitch: 0.0
        animation: walk
        camera-fov: 0.0
      - tick: 40
        x: 0.0
        y: 0.0
        z: 3.0
        yaw: 0.0
        pitch: 0.0
        animation: wave
        camera-yaw: 8.0
        camera-pitch: -3.0
        camera-fov: -8.0
      - tick: 60
        x: 0.0
        y: 0.0
        z: 4.5
        yaw: 0.0
        pitch: 0.0
        animation: bow
        camera-yaw: -6.0
        camera-pitch: 8.0
        camera-fov: -12.0
      - tick: 80
        x: 0.0
        y: 0.0
        z: 4.5
        yaw: 0.0
        pitch: 0.0
        animation: idle
        camera-fov: 0.0
