max-view-distance: 64.0
scenes:
  demo:
    duration-ticks: 80
    damage-policy: CANCEL_SCENE # or IGNORE_DAMAGE to cancel hits and keep the scene playing
    animation-damage-policies:
      wave: IGNORE_DAMAGE
      bow: CANCEL_SCENE
    frames:
      - tick: 0
        x: 0.0
        y: 0.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
        animation: idle
        camera-yaw: 0.0 # legacy fields are ignored to preserve user look direction
        camera-pitch: 0.0
        camera-roll: 0.0
        camera-shake: 0.0
        camera-fov: 0.0
      - tick: 20
        x: 0.0
        y: 0.0
        z: 1.5
        yaw: 0.0
        pitch: 0.0
        animation: walk
        camera-fov: 0.0
      - tick: 40
        x: 0.0
        y: 0.0
        z: 3.0
        yaw: 0.0
        pitch: 0.0
        animation: wave
        camera-fov: -8.0
      - tick: 60
        x: 0.0
        y: 0.0
        z: 4.5
        yaw: 0.0
        pitch: 0.0
        animation: bow
        camera-fov: -12.0
      - tick: 80
        x: 0.0
        y: 0.0
        z: 4.5
        yaw: 0.0
        pitch: 0.0
        animation: idle
        camera-fov: 0.0
